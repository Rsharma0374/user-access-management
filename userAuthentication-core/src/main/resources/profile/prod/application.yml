spring:
  application:
    name: identity-service
    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: false
          jdbc:
            time_zone: UTC
      open-in-view: false

    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true
      validate-on-migrate: true

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      ssl: ${REDIS_SSL:false}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

# Server Configuration
server:
  port: 10009
  servlet:
    context-path: /auth-service
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# Management / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.guardianservices.userauthentication: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Application Properties
app:
  auth:
    jwt:
      issuer: ${JWT_ISSUER:https://kon.guardianservices.in}
      audience: ${JWT_AUDIENCE:identity-service}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:10m}
      signing-key-alias: ${JWT_SIGNING_KEY_ALIAS:identity-signing-key}
      jwks-endpoint-path: ${JWT_JWKS_PATH:/.well-known/jwks.json}
    refresh:
      absolute-ttl: ${REFRESH_ABSOLUTE_TTL:30d}
      idle-ttl: ${REFRESH_IDLE_TTL:7d}
      rotation-grace-window-seconds: ${REFRESH_GRACE_WINDOW:0}
    password:
      argon2-memory-kib: ${ARGON2_MEMORY_KIB:65536}
      argon2-iterations: ${ARGON2_ITERATIONS:3}
      argon2-parallelism: ${ARGON2_PARALLELISM:4}
      max-length: ${PASSWORD_MAX_LENGTH:128}
      breached-password-api-url: ${BREACHED_PASSWORD_API_URL:}
    rate-limit:
      login-attempts-per-minute: ${RATE_LIMIT_LOGIN:10}
      register-attempts-per-hour: ${RATE_LIMIT_REGISTER:5}
      refresh-attempts-per-minute: ${RATE_LIMIT_REFRESH:20}
      verification-resend-attempts-per-hour: ${RATE_LIMIT_VERIFICATION:3}
    mfa:
      max-totp-attempts: ${MFA_MAX_TOTP_ATTEMPTS:5}
      max-recovery-code-attempts: ${MFA_MAX_RECOVERY_ATTEMPTS:10}
      recovery-code-count: ${MFA_RECOVERY_CODE_COUNT:10}
      recovery-code-length: ${MFA_RECOVERY_CODE_LENGTH:16}
      issuer: ${MFA_ISSUER:IdentityService}
    action-token:
      verification-ttl: ${ACTION_TOKEN_VERIFICATION_TTL:24h}
      password-reset-ttl: ${ACTION_TOKEN_PASSWORD_RESET_TTL:15m}
      email-change-ttl: ${ACTION_TOKEN_EMAIL_CHANGE_TTL:24h}
    session:
      csrf-enabled: true
      cookie-name: "__Host-refresh"
      cookie-path: "/"
      cookie-secure: true
      cookie-same-site: "Strict"

  storage:
    s3:
      region: ${AWS_REGION:ap-south-1}
      quarantine-bucket: ${S3_QUARANTINE_BUCKET}
      clean-bucket: ${S3_CLEAN_BUCKET}
      kms-key-id: ${S3_KMS_KEY_ID}
      endpoint-override: ""
    upload:
      profile-image-max-size-bytes: ${UPLOAD_PROFILE_MAX_SIZE:5242880}
      general-upload-max-size-bytes: ${UPLOAD_GENERAL_MAX_SIZE:52428800}
      presigned-post-ttl: ${UPLOAD_PRESIGNED_TTL:5m}
      download-url-ttl: ${DOWNLOAD_URL_TTL:60s}
      allowed-profile-image-types:
        - "image/jpeg"
        - "image/png"
        - "image/webp"
      allowed-general-upload-types: []
    quarantine:
      object-ttl: ${QUARANTINE_OBJECT_TTL:7d}
      multipart-ttl: ${QUARANTINE_MULTIPART_TTL:1d}

  notification:
    email:
      from-address: ${MAIL_FROM_ADDRESS}
      from-name: ${MAIL_FROM_NAME:Identity Service}
      base-url: "https://kong.guardianservices.in/auth-service"
      verification-path: "/v1/auth/email/verify"
      password-reset-path: "/reset-password"
      email-change-path: "/confirm-email-change"
    outbox:
      batch-size: ${OUTBOX_BATCH_SIZE:100}
      lease-duration: ${OUTBOX_LEASE_DURATION:5m}
      poll-interval: ${OUTBOX_POLL_INTERVAL:10s}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
      retry-backoff: ${OUTBOX_RETRY_BACKOFF:1m}
    encryption:
      key-alias: ${NOTIFICATION_ENCRYPTION_KEY_ALIAS}

# Swagger/OpenAPI
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true