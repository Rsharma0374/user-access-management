spring:
  application:
    name: identity-service-test

# Test Database Configuration (Testcontainers will override)
spring:
  datasource:
    url: jdbc:tc:postgresql:16:///identity_service_test
    username: test
    password: test
    hikari:
      maximum-pool-size: 10
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  redis:
    host: localhost
    port: 6379

# Test Application Properties
app:
  auth:
    jwt:
      issuer: "https://test.identity.example.com"
      audience: "identity-service-test"
      access-token-ttl: 10m
      signing-key-alias: "test-signing-key"
    refresh:
      absolute-ttl: 30d
      idle-ttl: 7d
    password:
      argon2-memory-kib: 4096  # Lower for faster tests
      argon2-iterations: 1
      argon2-parallelism: 1
      max-length: 128
    rate-limit:
      login-attempts-per-minute: 1000
      register-attempts-per-hour: 1000
    mfa:
      max-totp-attempts: 5
      recovery-code-count: 10
      recovery-code-length: 16
    action-token:
      verification-ttl: 24h
      password-reset-ttl: 15m
      email-change-ttl: 24h
    session:
      csrf-enabled: false
      cookie-secure: false

  storage:
    s3:
      region: "us-east-1"
      quarantine-bucket: "test-quarantine"
      clean-bucket: "test-clean"
      endpoint-override: "http://localhost:4566"
    upload:
      profile-image-max-size-bytes: 5242880
      presigned-post-ttl: 5m
      download-url-ttl: 60s
      allowed-profile-image-types:
        - "image/jpeg"
        - "image/png"
        - "image/webp"
    quarantine:
      object-ttl: 7d

  notification:
    email:
      from-address: "test@localhost"
      from-name: "Test Identity Service"
      base-url: "http://localhost:3000"
    outbox:
      batch-size: 10
      lease-duration: 1m
      poll-interval: 1s
      max-attempts: 3

# Logging for tests
logging:
  level:
    root: WARN
    com.guardianservices.userauthentication: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG